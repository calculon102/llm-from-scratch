# Sample profile: tiny_debug — the fastest profile in the ladder
# (tiny_debug -> tiny_train -> small -> medium -> max_7900xtx).
# Intended for smoke tests and CI; should run in seconds on CPU.
run_name: tiny_debug
seed: 42
device: auto
amp: false
profile: tiny_debug
output_dir: artifacts
log_interval: 5
batch_size: 8
learning_rate: 0.05
epochs: 50
val_split: 0.25
save_interval: 25
