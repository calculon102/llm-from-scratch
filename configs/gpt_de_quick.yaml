# Quick CPU smoke run on the local German corpus.
#
# The corpus is a small, representative slice staged under
# data/corpus_de_quick/ (see data/README.md).  It reuses the BPE bundle at
# data/corpus_de/tokenizer so the run does not retrain the tokenizer.
# 300 steps keeps this in the "minutes on CPU" range; raise max_steps when
# you want a longer run.
run_name: gpt_de_quick
profile: tiny_train
profile_defaults: true
max_steps: 300
save_interval: 100
log_interval: 25
phase: gpt
output_dir: artifacts
phase_config:
  corpus_path: data/corpus_de_quick
  tokenizer_bundle: data/corpus_de/tokenizer
