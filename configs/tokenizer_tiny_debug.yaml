run_name: tokenizer_tiny_debug
seed: 42
device: auto
amp: false
gradcheck: false
profile: tiny_debug
output_dir: artifacts
log_interval: 10
batch_size: 32
learning_rate: 0.001
epochs: 10
max_steps: null
val_split: 0.1
save_interval: 100

phase: tokenizer
phase_config:
  corpus_path: data/sample_de
  vocab_size: 300
  min_frequency: 2
  max_token_length: 16
  min_line_chars: 2
  max_line_chars: 2000
  min_alpha_ratio: 0.0
  drop_duplicates: true
  lowercase: false
  encodings:
    - utf-8-sig
    - utf-8
    - cp1252
    - latin-1
  extensions:
    - .txt
  metrics_sample_chars: 4000
